<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmed Talha Güler</title>
<meta name="description" content="Ahmed Talha Güler — aeronautical engineering student building web and mobile apps with Next.js and Flutter.">
<meta property="og:title" content="Ahmed Talha Güler">
<meta property="og:description" content="Apps and games I have built.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* ---------- jetonlar ---------- */
:root{
  color-scheme: light;
  --kagit:#F1EDF0;
  --yuzey:#FFFFFF;
  --yuzey2:#F8F5F8;
  --murekkep:#1A1D2B;
  --soluk:#6B6678;
  --cizgi:#DED6E0;
  --cizgi-koyu:#BFB4C2;
  --isaret:#B01E63;
  --isaret-zemin:#FBE8F0;
  --iyi:#1C7048;
  --iyi-zemin:#E3F2E9;
  --grid:rgba(26,29,43,.05);
  --golge:0 1px 2px rgba(26,29,43,.06), 0 8px 28px rgba(26,29,43,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --kagit:#131520;
    --yuzey:#1B1E2A;
    --yuzey2:#232634;
    --murekkep:#E9E6EE;
    --soluk:#948FA4;
    --cizgi:#2E3244;
    --cizgi-koyu:#414761;
    --isaret:#FF619A;
    --isaret-zemin:#3A1A2B;
    --iyi:#5CD49B;
    --iyi-zemin:#16301F;
    --grid:rgba(233,230,238,.055);
    --golge:0 1px 2px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --kagit:#131520;
  --yuzey:#1B1E2A;
  --yuzey2:#232634;
  --murekkep:#E9E6EE;
  --soluk:#948FA4;
  --cizgi:#2E3244;
  --cizgi-koyu:#414761;
  --isaret:#FF619A;
  --isaret-zemin:#3A1A2B;
  --iyi:#5CD49B;
  --iyi-zemin:#16301F;
  --grid:rgba(233,230,238,.055);
  --golge:0 1px 2px rgba(0,0,0,.4), 0 14px 40px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background-color:var(--kagit);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:56px 56px, 56px 56px;
  color:var(--murekkep);
  font-family:"Source Serif 4", Georgia, "Times New Roman", serif;
  font-size:17px;
  line-height:1.62;
}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--isaret);outline-offset:3px;border-radius:2px}

#gokyuzu{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.kap{max-width:1000px;margin:0 auto;padding:0 22px;position:relative;z-index:1}

/* ---------- ortak ---------- */
.etiket{
  font-family:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  font-size:10.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;
  color:var(--soluk);
}
h1,h2,h3{font-family:"Archivo", "Helvetica Neue", Arial, sans-serif;text-wrap:balance;margin:0}

/* ---------- antet bloğu ---------- */
header{padding:64px 0 0}
.serit{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px}
.serit .etiket{display:flex;align-items:center;gap:10px}
.serit .etiket::before{content:"";width:30px;height:1px;background:var(--isaret);flex:none}
.ustSag{display:flex;align-items:center;gap:10px;flex:none}

.dil{display:flex;border:1px solid var(--cizgi);border-radius:999px;overflow:hidden}
.dil button{
  font-family:"IBM Plex Mono", monospace;font-size:10.5px;font-weight:500;letter-spacing:.1em;
  background:transparent;border:0;color:var(--soluk);
  padding:8px 11px;cursor:pointer;line-height:1;
  transition:background .16s ease,color .16s ease;
}
.dil button + button{border-left:1px solid var(--cizgi)}
.dil button:hover{color:var(--murekkep)}
.dil button[aria-pressed="true"]{background:var(--murekkep);color:var(--kagit)}

.tema{
  width:34px;height:34px;padding:0;flex:none;
  color:var(--soluk);background:transparent;border:1px solid var(--cizgi);
  border-radius:999px;cursor:pointer;
  display:grid;place-items:center;
  transition:color .16s ease,border-color .16s ease;
}
.tema svg{width:15px;height:15px;display:block}
.tema:hover{color:var(--isaret);border-color:var(--isaret)}

.adim{
  font-size:clamp(40px,7.8vw,68px);font-weight:800;letter-spacing:-.034em;line-height:1;
  margin-bottom:20px;
}
/* adı aşağıdaki antet bloğuna bağlayan ince çizgi */
.altcizgi{height:1px;background:var(--cizgi);position:relative;margin-bottom:24px}
.altcizgi::before{content:"";position:absolute;inset:0 auto 0 0;width:72px;background:var(--isaret)}

.giris{font-size:18.5px;max-width:32em;margin:0 0 36px;text-wrap:pretty}
.giris em{color:var(--isaret);font-style:normal;font-weight:600}

.antet{
  display:grid;grid-template-columns:repeat(4,1fr);
  border:1px solid var(--cizgi-koyu);background:var(--yuzey);margin-bottom:66px;
}
.hucre{
  padding:15px 16px;border-right:1px solid var(--cizgi);min-width:0;
  display:flex;flex-direction:column;gap:7px;
}
.hucre:last-child{border-right:none}
.hucre .etiket{display:flex;align-items:center;gap:7px}
.hucre .etiket::before{content:"";width:9px;height:1px;background:var(--isaret);flex:none}
.hucre .deger{
  font-family:"IBM Plex Mono", monospace;font-size:13px;line-height:1.5;
  margin-top:0;overflow-wrap:anywhere;
}
.hucre a{text-decoration:none;border-bottom:1px solid var(--cizgi-koyu)}
.hucre a:hover{color:var(--isaret);border-bottom-color:var(--isaret)}
@media (max-width:820px){
  .antet{grid-template-columns:repeat(2,1fr)}
  .hucre:nth-child(2n){border-right:none}
  .hucre:nth-child(-n+2){border-bottom:1px solid var(--cizgi)}
}
/* dar ekranda tek sütun: etiket solda, değer sağda — künye satırı gibi */
@media (max-width:580px){
  .antet{grid-template-columns:1fr}
  .hucre{
    display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:baseline;
    border-right:none;border-bottom:1px solid var(--cizgi);padding:14px 15px;
  }
  .hucre:last-child{border-bottom:none}
}

/* ---------- bölüm başlığı ---------- */
.bolum-bas{display:flex;align-items:baseline;gap:14px;margin-bottom:22px}
.bolum-bas h2{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.bolum-bas .rule{flex:1;height:1px;background:var(--cizgi)}
.bolum-bas .sayi{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soluk)}

/* ---------- proje kütüğü ---------- */
.kutuk{display:flex;flex-direction:column;gap:14px;margin-bottom:66px}
.proje{
  display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:20px;
  width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--yuzey);border:1px solid var(--cizgi);border-left:3px solid var(--cizgi-koyu);
  padding:20px 22px;
  transition:border-left-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.proje:hover,.proje:focus-visible{border-left-color:var(--isaret);transform:translateX(3px);box-shadow:var(--golge)}
.proje:hover .glif,.proje:hover .ac{color:var(--isaret)}
.proje.sessiz{cursor:default;border-left-style:dashed;background:var(--yuzey2)}
.proje.sessiz:hover{transform:none;box-shadow:none;border-left-color:var(--cizgi-koyu)}
.proje.sessiz:hover .glif{color:var(--murekkep)}
.glif{color:var(--murekkep);transition:color .18s ease;display:block}
.glif svg{width:46px;height:46px;display:block}
.govde{display:block;min-width:0}
.ust{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:5px}
.ad{font-family:"Archivo",Arial,sans-serif;font-size:21px;font-weight:700;letter-spacing:-.015em}
.ozet{display:block;color:var(--soluk);font-size:15.5px;line-height:1.5;max-width:52ch}
.olcu{
  display:block;margin-top:9px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  color:var(--soluk);font-variant-numeric:tabular-nums;
}
.ac{
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--soluk);white-space:nowrap;transition:color .18s ease;
}
@media (max-width:700px){
  .proje{grid-template-columns:40px 1fr;gap:15px;padding:17px 16px}
  .glif svg{width:34px;height:34px}
  .ac{display:none}
}

.rozet{
  font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:3px;line-height:1.5;
  display:inline-block;
}
.rozet.yayinda{background:var(--iyi-zemin);color:var(--iyi)}
.rozet.gelisiyor{background:var(--isaret-zemin);color:var(--isaret)}
.rozet.yakinda{background:var(--yuzey);color:var(--murekkep);border:1px solid var(--cizgi-koyu)}

/* ---------- kulup paneli ---------- */
.kulup{
  border:1px solid var(--cizgi-koyu);background:var(--yuzey);
  padding:24px 26px;margin-bottom:66px;
  display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;
}
.kulup h3{font-size:23px;font-weight:700;letter-spacing:-.022em;margin-bottom:9px}
.kulup p{margin:0;color:var(--soluk);font-size:15.5px;line-height:1.55;max-width:44ch}
.kulup .baglar{margin:0;flex-direction:column;align-items:stretch;flex-wrap:nowrap}
@media (max-width:760px){
  .kulup{grid-template-columns:1fr;gap:20px;padding:20px 18px}
  .kulup .baglar{flex-direction:row;flex-wrap:wrap}
}

/* ---------- alt bilgi ---------- */
footer{border-top:1px solid var(--cizgi);padding:30px 0 64px}
.baglar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 22px}
.bag{
  display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;
  border:1px solid var(--cizgi-koyu);padding:9px 14px;background:var(--yuzey);
  transition:background .16s ease,color .16s ease,border-color .16s ease;
}
.bag:hover{background:var(--murekkep);color:var(--kagit);border-color:var(--murekkep)}
.bag svg{width:15px;height:15px;flex:none}
.imza{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--soluk);letter-spacing:.04em;margin:0}

/* ---------- künye (detay) ---------- */
.perde{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(12,13,20,.55);backdrop-filter:blur(3px);
  padding:20px;overflow-y:auto;
}
.perde.acik{display:flex;align-items:flex-start;justify-content:center}
.kunye{
  background:var(--yuzey);border:1px solid var(--cizgi-koyu);box-shadow:var(--golge);
  width:100%;max-width:780px;margin:auto;
}
.kunye-bas{
  display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:start;
  padding:24px 26px 20px;border-bottom:1px solid var(--cizgi);
}
.kunye-bas .glif{color:var(--isaret)}
.kunye-bas h3{font-size:27px;font-weight:800;letter-spacing:-.025em;margin-bottom:8px}
.kapat{
  background:transparent;border:1px solid var(--cizgi);color:var(--soluk);
  width:34px;height:34px;cursor:pointer;font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.kapat:hover{background:var(--murekkep);color:var(--kagit);border-color:var(--murekkep)}
.kunye-govde{padding:24px 26px 28px}
.kunye-govde > * + *{margin-top:26px}
.anlati{margin:0;font-size:17px;line-height:1.65}

.olcu-satir{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));border:1px solid var(--cizgi)}
.olcu-satir div{padding:11px 14px;border-right:1px solid var(--cizgi)}
.olcu-satir div:last-child{border-right:none}
.olcu-satir .buyuk{
  font-family:"Archivo",Arial,sans-serif;font-size:21px;font-weight:700;
  font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.02em;
}

.liste{list-style:none;margin:0;padding:0}
.liste li{
  padding:12px 0;border-top:1px solid var(--cizgi);
  display:grid;grid-template-columns:14px 1fr;gap:13px;font-size:15.5px;line-height:1.55;
}
.liste li:first-child{border-top:none;padding-top:0}
.liste li::before{content:"";width:7px;height:7px;background:var(--isaret);margin-top:9px;transform:rotate(45deg)}
.liste b{font-weight:600}

.yigin{display:flex;flex-wrap:wrap;gap:7px}
.cip{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  background:var(--yuzey2);border:1px solid var(--cizgi);padding:5px 9px;color:var(--soluk);
}
.not{font-size:14.5px;line-height:1.55;color:var(--soluk);border-left:2px solid var(--cizgi-koyu);padding-left:14px;margin:0}
.vitrin{display:flex;gap:13px;overflow-x:auto;padding-bottom:8px}
.vitrin figure{margin:0;flex:none;width:176px}
.vitrin img{border:1px solid var(--cizgi-koyu);border-radius:10px;background:#000}
.vitrin figcaption{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--soluk);
  margin-top:7px;letter-spacing:.03em;
}
@media (max-width:640px){
  .kunye-bas{grid-template-columns:1fr auto;padding:20px 18px 17px}
  .kunye-bas .glif{display:none}
  .kunye-govde{padding:20px 18px 24px}
  .perde{padding:0}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>

    a.className = "bag";
    a.href = url;
    if (url.indexOf("http") === 0) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    a.innerHTML = ikon + "<span>" + yazi + "</span>";
    baglar.appendChild(a);
  }
  bagVer("mailto:" + KISI.eposta, IKON.posta, KISI.eposta);
  bagVer(KISI.github, IKON.github, "github.com/ahmetqler");
  bagVer(KISI.linkedin, IKON.linkedin, "LinkedIn");
}

/* --- künye --- */
var perde = document.getElementById("perde");
var kunye = document.getElementById("kunye");
var sonOdak = null;

function ac(i) {
  var m = M();
  var p = PROJELER[i];
  var y = p[dilSimdi];
  sonOdak = document.activeElement;

  var sayilar = (y.sayilar && y.sayilar.length)
    ? '<div class="olcu-satir">' + y.sayilar.map(function (s) {
        return '<div><div class="etiket">' + kacis(s.ad) + '</div><div class="buyuk">' + kacis(s.deger) + '</div></div>';
      }).join("") + '</div>'
    : "";

  var gorseller = (p.gorseller && p.gorseller.length)
    ? '<section><div class="etiket" style="margin-bottom:12px">' + kacis(m.ekrandan) + '</div><div class="vitrin">' +
      p.gorseller.map(function (g) {
        var yazi = g[dilSimdi];
        return '<figure><img src="' + g.src + '" alt="' + kacis(p.ad) + ' — ' + kacis(yazi) + '" loading="lazy">' +
               '<figcaption>' + kacis(yazi) + '</figcaption></figure>';
      }).join("") + '</div></section>'
    : "";

  var guvence = y.guvence
    ? '<section><div class="etiket" style="margin-bottom:10px">' + kacis(m.dikkat) + '</div>' +
      '<p class="anlati" style="font-size:15.5px">' + y.guvence + '</p></section>'
    : "";

  var not = y.not ? '<p class="not">' + kacis(y.not) + '</p>' : "";

  var linkler = [];
  if (p.canli) {
    linkler.push('<a class="bag" href="' + p.canli + '" target="_blank" rel="noopener noreferrer">' + IKON.dis +
      '<span>' + kacis(m.canli) + p.canli.replace("https://", "") + '</span></a>');
  }
  if (p.depo) {
    linkler.push('<a class="bag" href="' + p.depo + '" target="_blank" rel="noopener noreferrer">' + IKON.github +
      '<span>' + kacis(m.kaynak) + '</span></a>');
  }
  var baglantilar = linkler.length ? '<div class="baglar" style="margin:0">' + linkler.join("") + '</div>' : "";

  kunye.innerHTML =
    '<div class="kunye-bas">' +
      '<span class="glif">' + p.glif + '</span>' +
      '<div><h3 id="kunye-ad">' + kacis(p.ad) + '</h3>' +
      '<span class="rozet ' + p.rozetTipi + '">' + kacis(y.durum) + '</span></div>' +
      '<button class="kapat" type="button" aria-label="' + kacis(m.kapat) + '">&#10005;</button>' +
    '</div>' +
    '<div class="kunye-govde">' +
      '<p class="anlati">' + kacis(y.anlati) + '</p>' +
      sayilar +
      '<section><div class="etiket" style="margin-bottom:12px">' + kacis(m.neYapiyor) + '</div>' +
      '<ul class="liste">' + y.ozellikler.map(function (o) { return '<li><span>' + o + '</span></li>'; }).join("") + '</ul></section>' +
      guvence + not + gorseller +
      '<section><div class="etiket" style="margin-bottom:11px">' + kacis(m.teknoloji) + '</div>' +
      '<div class="yigin">' + p.teknoloji.map(function (t) { return '<span class="cip">' + kacis(t) + '</span>'; }).join("") + '</div></section>' +
      baglantilar +
    '</div>';

  perde.classList.add("acik");
  document.body.style.overflow = "hidden";
  var kapatDugme = kunye.querySelector(".kapat");
  kapatDugme.addEventListener("click", kapat);
  kapatDugme.focus();
  perde.scrollTop = 0;
}

function kapat() {
  perde.classList.remove("acik");
  document.body.style.overflow = "";
  kunye.innerHTML = "";
  if (sonOdak && document.contains(sonOdak)) sonOdak.focus();
}

perde.addEventListener("click", function (e) { if (e.target === perde) kapat(); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && perde.classList.contains("acik")) kapat();
});

/* --- dil --- */
var dilKutu = document.getElementById("dil");
["en", "tr"].forEach(function (kod) {
  var b = document.createElement("button");
  b.type = "button";
  b.textContent = kod.toUpperCase();
  b.setAttribute("data-dil", kod);
  b.addEventListener("click", function () { dilYaz(kod); });
  dilKutu.appendChild(b);
});

function dilYaz(kod) {
  dilSimdi = (kod === "tr") ? "tr" : "en";
  try { localStorage.setItem("dil", dilSimdi); } catch (e) {}

  [].forEach.call(dilKutu.children, function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-dil") === dilSimdi ? "true" : "false");
  });

  if (perde.classList.contains("acik")) kapat();
  cerceveCiz();
  kutukCiz();
  baglarCiz();
  temaEtiketiYaz();
}

/* --- tema --- */
var temaDugme = document.getElementById("tema");
function temaEtiketiYaz() {
  var koyu = document.documentElement.getAttribute("data-theme") === "dark";
  var m = M();
  temaDugme.innerHTML = koyu ? TEMA_IKON.gunes : TEMA_IKON.ay;
  temaDugme.setAttribute("aria-label", koyu ? m.temaAcik : m.temaKoyu);
  temaDugme.setAttribute("title", koyu ? m.temaAcik : m.temaKoyu);
}
function temaYaz(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("tema", t); } catch (e) {}
  temaEtiketiYaz();
  if (window.gokyuzuRenkYenile) window.gokyuzuRenkYenile();
}
temaDugme.addEventListener("click", function () {
  temaYaz(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
});

/* --- ilk çizim --- */
(function () {
  var kayitliDil = null, kayitliTema = null;
  try { kayitliDil = localStorage.getItem("dil"); } catch (e) {}
  try { kayitliTema = localStorage.getItem("tema"); } catch (e) {}

  var sistemTema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", kayitliTema || sistemTema);

  dilYaz(kayitliDil || VARSAYILAN_DIL);
})();
/* =====================================================================
   ARKA PLANDA UÇAN UÇAKLAR

   Skyphrase'in (Flutter) FlightTrailsBackground'ından uyarlandı. Dart kodu
   birebir taşınamaz — orada CustomPainter var — ama tekniğin kendisi aynı:
   uçak PNG'lerinin yalnızca alfa kanalı kullanılıyor, gövde tema rengiyle
   boyanıyor. Flutter'da BlendMode.srcIn, burada canvas'ın "source-in"
   birleştirmesi. Görseller de Skyphrase'den geldi (ucaklar/).

   Uçağın burnu her zaman gidiş yönünü gösterir: görseller sağa bakacak
   şekilde hizalı, dönme açısı da doğrudan hareket vektöründen geliyor.
   Rotalar düz ya da yay; kalp/gösteri formasyonları yok.

   Rotalar SAYFA koordinatında: uçak sayfanın bir yerine aittir, kaydırınca
   içerikle birlikte yukarı kayar. Tuval yine ekran boyunda (uzun sayfada
   dev bir tuval bellek yemesin diye); çizerken kaydırma kadar ötelenir.

   prefers-reduced-motion açıksa hiç çalışmaz.
   ===================================================================== */
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var TURLER = [
    { src: "ucaklar/concorde.png", oran: 85 / 202 },
    { src: "ucaklar/a380.png",     oran: 168 / 187 },
    { src: "ucaklar/cessna.png",   oran: 136 / 121, olcek: 0.62 }
  ];

  var REF = 128;   // boyanmış kopyanın referans genişliği (ölçeklenerek çizilir)

  var tuval = document.createElement("canvas");
  tuval.id = "gokyuzu";
  tuval.setAttribute("aria-hidden", "true");
  document.body.insertBefore(tuval, document.body.firstChild);
  var cx = tuval.getContext("2d");

  var g = 0, y = 0, sy = 0;   // g,y: ekran; sy: sayfanın tüm yüksekliği
  var gorseller = [], boyali = [], ucuslar = [];
  var renkUcak = "", renkIz = "", renkVurgu = "";
  var hazir = false;

  function olcu() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    g = window.innerWidth;
    y = window.innerHeight;
    sy = Math.max(document.documentElement.scrollHeight, y);
    tuval.width = Math.round(g * dpr);
    tuval.height = Math.round(y * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function jeton(ad) {
    return getComputedStyle(document.documentElement).getPropertyValue(ad).trim();
  }

  function alfa(hex, a) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    if (isNaN(n)) return "rgba(128,128,128," + a + ")";
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }

  /* Tema rengine boya — Flutter'daki ColorFilter.mode(..., BlendMode.srcIn) */
  function boya() {
    renkUcak  = alfa(jeton("--murekkep"), 0.30);
    renkIz    = alfa(jeton("--murekkep"), 0.13);
    renkVurgu = alfa(jeton("--isaret"),   0.20);

    boyali = TURLER.map(function (t, i) {
      var gg = REF, yy = Math.round(REF * t.oran);
      var c = document.createElement("canvas");
      c.width = gg; c.height = yy;
      var k = c.getContext("2d");
      k.drawImage(gorseller[i], 0, 0, gg, yy);
      k.globalCompositeOperation = "source-in";
      k.fillStyle = renkUcak;
      k.fillRect(0, 0, gg, yy);
      return c;
    });
  }
  window.gokyuzuRenkYenile = function () { if (hazir) boya(); };

  /* Rota uçları. Hedef: ekranda o an duran izlerin boy / (boy + en) kadarı
     yatay olsun — uzun sayfada (telefon) izlerin çoğu yatay.

     Ama kalkış olasılığını doğrudan bu oran yapmak yetmiyor: uçak rotasını
     bitirince yerine yenisi geliyor ve süre rota uzunluğuyla orantılı. Uzun
     dikey uçuş ekranda çok daha uzun kalır, izleri birikir. Süre (≈ en ya da
     boy) hesaba katılınca kalkış olasılığı boy² / (boy² + en²) çıkıyor. */
  function uclar() {
    var pay = 0.14;                       // ekran dışı pay, genişliğin kesri
    if (Math.random() < sy * sy / (sy * sy + g * g)) {
      /* Yatay: iniş/çıkış en fazla 0,7 ekran boyu ve genişliğin %35'i —
         dar ekranda da gerçekten yatay kalsın */
      var ay = Math.random();
      var inis = Math.min(y * 0.7, g * 0.35);
      var by = Math.min(1, Math.max(0, ay + (Math.random() * 2 - 1) * inis / sy));
      var soldan = Math.random() < 0.5;
      return { a: { x: soldan ? -pay : 1 + pay, y: ay },
               b: { x: soldan ? 1 + pay : -pay, y: by } };
    }
    var payY = pay * g / sy;              // aynı pay, piksel olarak
    var yukaridan = Math.random() < 0.5;
    return { a: { x: Math.random(), y: yukaridan ? -payY : 1 + payY },
             b: { x: Math.random(), y: yukaridan ? 1 + payY : -payY } };
  }

  function yeniUcus() {
    var i = Math.floor(Math.random() * TURLER.length);
    var t = TURLER[i];
    var u = uclar(), a = u.a, b = u.b;

    /* Yay: orta noktadan rotaya dik sapma, PİKSEL uzayında (uzun sayfada
       normalize uzayda hesaplamak dev kavisler üretiyordu). Uçuşların ~%35'i
       belirgin yay çizer, kalanı neredeyse düz gider. */
    var dx = b.x - a.x, dy = b.y - a.y;
    var dxp = dx * g, dyp = dy * sy;
    var pikselUz = Math.hypot(dxp, dyp) || 1;
    var sapma = (Math.random() < 0.35 ? 0.18 + Math.random() * 0.3 : Math.random() * 0.07)
              * (Math.random() < 0.5 ? -1 : 1) * pikselUz;

    /* Hız sabit: süre rota uzunluğundan gelir. */
    var hiz = Math.hypot(g, y) / (14 + Math.random() * 13);   // ekran köşegeni / 14-27 sn

    return {
      tur: i,
      boy: (9 + Math.random() * 8) * (t.olcek || 1) * 2,
      a: a,
      b: b,
      k: { x: (a.x + b.x) / 2 - dyp / pikselUz * sapma / g,
           y: (a.y + b.y) / 2 + dxp / pikselUz * sapma / sy },
      sure: Math.max(10, pikselUz / hiz),
      gecen: -Math.random() * 4,
      vurgulu: Math.random() < 0.25
    };
  }

  function nokta(u, t) {
    var s = 1 - t;
    return {
      x: (s * s * u.a.x + 2 * s * t * u.k.x + t * t * u.b.x) * g,
      y: (s * s * u.a.y + 2 * s * t * u.k.y + t * t * u.b.y) * sy
    };
  }

  var oncekiZaman = 0;
  function kare(zaman) {
    var fark = oncekiZaman ? Math.min((zaman - oncekiZaman) / 1000, 0.05) : 0;
    oncekiZaman = zaman;

    cx.setTransform(tuval.width / g, 0, 0, tuval.height / y, 0, 0);
    cx.clearRect(0, 0, g, y);
    cx.translate(0, -window.scrollY);   // sayfa koordinatından ekrana
    cx.lineWidth = 1.2;
    cx.lineCap = "round";

    for (var i = 0; i < ucuslar.length; i++) {
      var u = ucuslar[i];
      u.gecen += fark;

      if (u.gecen >= u.sure) { ucuslar[i] = yeniUcus(); continue; }
      if (u.gecen < 0) continue;

      var t = u.gecen / u.sure;

      /* İz: kalkıştan şu ana kadar geçilen yol */
      cx.beginPath();
      for (var j = 0; j <= 36; j++) {
        var p = nokta(u, t * (j / 36));
        if (j === 0) cx.moveTo(p.x, p.y); else cx.lineTo(p.x, p.y);
      }
      cx.strokeStyle = u.vurgulu ? renkVurgu : renkIz;
      cx.stroke();

      /* Uçak: burnu hareket vektörüne bakar */
      var p1 = nokta(u, t);
      var p0 = nokta(u, Math.max(0, t - 0.008));
      var gg = u.boy, yy = gg * TURLER[u.tur].oran;
      cx.save();
      cx.translate(p1.x, p1.y);
      cx.rotate(Math.atan2(p1.y - p0.y, p1.x - p0.x));
      cx.drawImage(boyali[u.tur], -gg / 2, -yy / 2, gg, yy);
      cx.restore();
    }

    requestAnimationFrame(kare);
  }

  var yuklenen = 0, hatali = false;
  TURLER.forEach(function (t, i) {
    var im = new Image();
    im.onload = function () { gorseller[i] = im; if (++yuklenen === TURLER.length) basla(); };
    im.onerror = function () { hatali = true; if (++yuklenen === TURLER.length) basla(); };
    im.src = t.src;
  });

  /* Ekran başına yoğunluk sabit: sayfa kaç ekran boyuysa o kadar uçak */
  function adetAyarla(ilk) {
    var ekranBasina = window.innerWidth < 700 ? 3 : 6;
    var hedef = Math.min(24, Math.round(ekranBasina * sy / y));
    while (ucuslar.length < hedef) {
      var u = yeniUcus();
      if (ilk) u.gecen = Math.random() * u.sure * 0.75;   // ilk kare boş kalmasın
      ucuslar.push(u);
    }
    if (ucuslar.length > hedef) ucuslar.length = hedef;
  }

  function basla() {
    if (hatali) { tuval.remove(); return; }   // görsel gelmediyse hiç çizme
    hazir = true;
    olcu();
    boya();
    adetAyarla(true);
    window.addEventListener("resize", function () { olcu(); adetAyarla(false); });
    /* Dil değişince ya da görseller yüklenince sayfa boyu değişir */
    if (window.ResizeObserver) {
      new ResizeObserver(function () { olcu(); adetAyarla(false); }).observe(document.body);
    }
    requestAnimationFrame(kare);
  }
})();
</script>
